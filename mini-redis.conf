# Options in this file are applied in order. CLI options after --config override it.
bind 127.0.0.1
port 6380
dir .data
appendonly yes
appendfsync everysec
io-model epoll
workers 4
maxclients 10000
timeout 0
# Approximate dataset accounting. Zero disables the limit.
maxmemory 0
maxmemory-policy noeviction
client-output-buffer-limit 8388608
proto-max-bulk-len 536870912
aof-rewrite-min-size 67108864
